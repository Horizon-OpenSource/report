<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#40464e"/><rect x="40" y="40" width="1520" height="820" rx="22" fill="#f8faf9"/>
<rect x="40" y="40" width="1520" height="120" rx="22" fill="#00695c"/><text x="80" y="105" font-family="Arial" font-size="38" font-weight="700" fill="white">User Persona compuesto - Empresas exportadoras</text>
<text x="80" y="145" font-family="Arial" font-size="20" fill="#d8f3ee">Fuentes: entrevistas E01, E02 y E03</text>
<rect x="80" y="205" width="430" height="590" rx="16" fill="#e0f2f1"/><text x="115" y="260" font-family="Arial" font-size="27" font-weight="700" fill="#164e47">Responsable de Calidad y Sostenibilidad</text>
<text x="115" y="315" font-family="Arial" font-size="20" fill="#334155">Perfil compuesto, sin edad ni distrito inventados.</text><text x="115" y="360" font-family="Arial" font-size="20" fill="#334155">Contexto observado:</text>
<text x="130" y="405" font-family="Arial" font-size="19" fill="#334155">- Agroindustria, textil y transporte.</text><text x="130" y="445" font-family="Arial" font-size="19" fill="#334155">- Reportes para clientes y auditorias.</text><text x="130" y="485" font-family="Arial" font-size="19" fill="#334155">- Uso de Excel y registros fisicos.</text>
<text x="115" y="560" font-family="Arial" font-size="22" font-weight="700" fill="#164e47">Frase representativa</text><text x="115" y="610" font-family="Arial" font-size="18" font-style="italic" fill="#334155">Necesito evidencias ordenadas para</text><text x="115" y="642" font-family="Arial" font-size="18" font-style="italic" fill="#334155">responder sin reconstruir los datos.</text>
<rect x="550" y="205" width="460" height="265" rx="16" fill="white" stroke="#b7d7d2"/><text x="585" y="255" font-family="Arial" font-size="25" font-weight="700" fill="#164e47">Goals</text><text x="585" y="305" font-family="Arial" font-size="19" fill="#334155">- Preparar reportes por periodo o lote.</text><text x="585" y="345" font-family="Arial" font-size="19" fill="#334155">- Mantener trazabilidad de evidencias.</text><text x="585" y="385" font-family="Arial" font-size="19" fill="#334155">- Cumplir solicitudes de clientes.</text><text x="585" y="425" font-family="Arial" font-size="19" fill="#334155">- Reducir errores manuales.</text>
<rect x="1050" y="205" width="460" height="265" rx="16" fill="#fde2de"/><text x="1085" y="255" font-family="Arial" font-size="25" font-weight="700" fill="#7f1d1d">Pains</text><text x="1085" y="305" font-family="Arial" font-size="19" fill="#334155">- Perdida y falta de respaldo.</text><text x="1085" y="345" font-family="Arial" font-size="19" fill="#334155">- Duplicidad y versiones distintas.</text><text x="1085" y="385" font-family="Arial" font-size="19" fill="#334155">- Dificultad para usar Excel.</text><text x="1085" y="425" font-family="Arial" font-size="19" fill="#334155">- Observaciones en auditorias.</text>
<rect x="550" y="510" width="460" height="285" rx="16" fill="#e6f4ff"/><text x="585" y="560" font-family="Arial" font-size="25" font-weight="700" fill="#164e47">Behaviors and tools</text><text x="585" y="610" font-family="Arial" font-size="19" fill="#334155">- Excel, cuadernos, fotos y recibos.</text><text x="585" y="650" font-family="Arial" font-size="19" fill="#334155">- Consolida datos manualmente.</text><text x="585" y="690" font-family="Arial" font-size="19" fill="#334155">- Coordina con otras areas.</text><text x="585" y="730" font-family="Arial" font-size="19" fill="#334155">- Revisa datos mensuales o por lote.</text>
<rect x="1050" y="510" width="460" height="285" rx="16" fill="#e2f6ef"/><text x="1085" y="560" font-family="Arial" font-size="25" font-weight="700" fill="#164e47">Needs from EcoTrack</text><text x="1085" y="610" font-family="Arial" font-size="19" fill="#334155">- Carga simple y movil.</text><text x="1085" y="650" font-family="Arial" font-size="19" fill="#334155">- Reportes por periodo o lote.</text><text x="1085" y="690" font-family="Arial" font-size="19" fill="#334155">- Calculos e indicadores automaticos.</text><text x="1085" y="730" font-family="Arial" font-size="19" fill="#334155">- Historial y evidencias centralizadas.</text>
</svg>