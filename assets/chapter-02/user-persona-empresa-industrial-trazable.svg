<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#40464e"/><rect x="40" y="40" width="1520" height="820" rx="22" fill="#f8faf9"/>
<rect x="40" y="40" width="1520" height="120" rx="22" fill="#00695c"/><text x="80" y="105" font-family="Arial" font-size="38" font-weight="700" fill="white">User Persona compuesto - Empresas industriales</text>
<text x="80" y="145" font-family="Arial" font-size="20" fill="#d8f3ee">Fuentes: entrevistas E04, E05 y E06</text>
<rect x="80" y="205" width="430" height="590" rx="16" fill="#e0f2f1"/><text x="115" y="260" font-family="Arial" font-size="27" font-weight="700" fill="#164e47">Responsable de Operaciones</text>
<text x="115" y="315" font-family="Arial" font-size="20" fill="#334155">Perfil compuesto, sin edad ni distrito inventados.</text><text x="115" y="360" font-family="Arial" font-size="20" fill="#334155">Contexto observado:</text>
<text x="130" y="405" font-family="Arial" font-size="19" fill="#334155">- Industria, alimentos y taller.</text><text x="130" y="445" font-family="Arial" font-size="19" fill="#334155">- Datos de distintas areas.</text><text x="130" y="485" font-family="Arial" font-size="19" fill="#334155">- Reportes para gerencia.</text>
<text x="115" y="560" font-family="Arial" font-size="22" font-weight="700" fill="#164e47">Frase representativa</text><text x="115" y="610" font-family="Arial" font-size="18" font-style="italic" fill="#334155">Quiero comparar consumos y emisiones</text><text x="115" y="642" font-family="Arial" font-size="18" font-style="italic" fill="#334155">sin reunir archivos de cada area.</text>
<rect x="550" y="205" width="460" height="265" rx="16" fill="white" stroke="#b7d7d2"/><text x="585" y="255" font-family="Arial" font-size="25" font-weight="700" fill="#164e47">Goals</text><text x="585" y="305" font-family="Arial" font-size="19" fill="#334155">- Controlar consumos por area.</text><text x="585" y="345" font-family="Arial" font-size="19" fill="#334155">- Comparar meses, plantas o trabajos.</text><text x="585" y="385" font-family="Arial" font-size="19" fill="#334155">- Presentar indicadores a gerencia.</text><text x="585" y="425" font-family="Arial" font-size="19" fill="#334155">- Seguir metas de reduccion.</text>
<rect x="1050" y="205" width="460" height="265" rx="16" fill="#fde2de"/><text x="1085" y="255" font-family="Arial" font-size="25" font-weight="700" fill="#7f1d1d">Pains</text><text x="1085" y="305" font-family="Arial" font-size="19" fill="#334155">- Formatos inconsistentes.</text><text x="1085" y="345" font-family="Arial" font-size="19" fill="#334155">- Datos incompletos o tardios.</text><text x="1085" y="385" font-family="Arial" font-size="19" fill="#334155">- Comparacion manual compleja.</text><text x="1085" y="425" font-family="Arial" font-size="19" fill="#334155">- Poco detalle de desperdicios.</text>
<rect x="550" y="510" width="460" height="285" rx="16" fill="#e6f4ff"/><text x="585" y="560" font-family="Arial" font-size="25" font-weight="700" fill="#164e47">Behaviors and tools</text><text x="585" y="610" font-family="Arial" font-size="19" fill="#334155">- Excel, correo, WhatsApp y facturas.</text><text x="585" y="650" font-family="Arial" font-size="19" fill="#334155">- Solicita datos a varias areas.</text><text x="585" y="690" font-family="Arial" font-size="19" fill="#334155">- Revisa energia, agua y combustible.</text><text x="585" y="730" font-family="Arial" font-size="19" fill="#334155">- Prepara comparaciones periodicas.</text>
<rect x="1050" y="510" width="460" height="285" rx="16" fill="#e2f6ef"/><text x="1085" y="560" font-family="Arial" font-size="25" font-weight="700" fill="#164e47">Needs from EcoTrack</text><text x="1085" y="610" font-family="Arial" font-size="19" fill="#334155">- Registro estandarizado.</text><text x="1085" y="650" font-family="Arial" font-size="19" fill="#334155">- Dashboard por area y periodo.</text><text x="1085" y="690" font-family="Arial" font-size="19" fill="#334155">- Historial y reportes gerenciales.</text><text x="1085" y="730" font-family="Arial" font-size="19" fill="#334155">- Metas y seguimiento de avances.</text>
</svg>