<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1100" viewBox="0 0 1900 1100">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1900" height="1100" fill="#f8fafc"/><text x="60" y="65" font-family="Arial" font-size="40" font-weight="700" fill="#0f172a">EcoTrack Impact Mapping - SMART Business Goals</text>
<text x="60" y="108" font-family="Arial" font-size="21" fill="#475569">Goal - Actors - Impacts - Deliverables - Measurement</text>
<g font-family="Arial"><text x="65" y="165" font-size="20" font-weight="700" fill="#0f172a">GOAL</text><text x="430" y="165" font-size="20" font-weight="700" fill="#0f172a">ACTORS</text><text x="760" y="165" font-size="20" font-weight="700" fill="#0f172a">IMPACTS</text><text x="1190" y="165" font-size="20" font-weight="700" fill="#0f172a">DELIVERABLES</text><text x="1640" y="165" font-size="20" font-weight="700" fill="#0f172a">MEASURE</text></g>
<rect x="45" y="190" width="1810" height="250" rx="18" fill="#ecfeff"/>
<rect x="65" y="220" width="315" height="185" rx="14" fill="#0f766e"/><text x="90" y="260" font-family="Arial" font-size="21" font-weight="700" fill="white">Goal 1 - Adoption</text><text x="90" y="300" font-family="Arial" font-size="17" fill="white">80% of pilots configure org,</text><text x="90" y="330" font-family="Arial" font-size="17" fill="white">facility, period and 3 sources</text><text x="90" y="360" font-family="Arial" font-size="17" fill="white">in 14 days by 31/12/2026.</text>
<rect x="430" y="240" width="270" height="145" rx="12" fill="#fde68a"/><text x="455" y="280" font-family="Arial" font-size="18" fill="#1f2937">Administrator</text><text x="455" y="315" font-family="Arial" font-size="18" fill="#1f2937">Sustainability lead</text><text x="455" y="350" font-family="Arial" font-size="18" fill="#1f2937">Environmental analyst</text>
<rect x="760" y="225" width="365" height="175" rx="12" fill="#ddd6fe"/><text x="785" y="265" font-family="Arial" font-size="18" fill="#1f2937">Complete onboarding</text><text x="785" y="305" font-family="Arial" font-size="18" fill="#1f2937">Centralize dispersed data</text><text x="785" y="345" font-family="Arial" font-size="18" fill="#1f2937">Classify sources by scope</text>
<rect x="1190" y="220" width="390" height="185" rx="12" fill="#bfdbfe"/><text x="1215" y="260" font-family="Arial" font-size="18" fill="#1f2937">Organization and facilities</text><text x="1215" y="300" font-family="Arial" font-size="18" fill="#1f2937">Users and roles</text><text x="1215" y="340" font-family="Arial" font-size="18" fill="#1f2937">Emission sources + CSV import</text>
<rect x="1640" y="240" width="185" height="145" rx="12" fill="#bbf7d0"/><text x="1665" y="280" font-family="Arial" font-size="17" fill="#1f2937">Completion rate</text><text x="1665" y="320" font-family="Arial" font-size="17" fill="#1f2937">within 14 days</text>
<rect x="45" y="465" width="1810" height="250" rx="18" fill="#fff7ed"/>
<rect x="65" y="495" width="315" height="185" rx="14" fill="#c2410c"/><text x="90" y="535" font-family="Arial" font-size="21" font-weight="700" fill="white">Goal 2 - Efficiency</text><text x="90" y="575" font-family="Arial" font-size="17" fill="white">Reduce monthly reporting time</text><text x="90" y="605" font-family="Arial" font-size="17" fill="white">by 40% versus baseline</text><text x="90" y="635" font-family="Arial" font-size="17" fill="white">by 31/03/2027.</text>
<rect x="430" y="515" width="270" height="145" rx="12" fill="#fde68a"/><text x="455" y="555" font-family="Arial" font-size="18" fill="#1f2937">Sustainability lead</text><text x="455" y="595" font-family="Arial" font-size="18" fill="#1f2937">Operations supervisor</text><text x="455" y="635" font-family="Arial" font-size="18" fill="#1f2937">Management</text>
<rect x="760" y="500" width="365" height="175" rx="12" fill="#ddd6fe"/><text x="785" y="540" font-family="Arial" font-size="18" fill="#1f2937">Use consistent records</text><text x="785" y="580" font-family="Arial" font-size="18" fill="#1f2937">Avoid manual consolidation</text><text x="785" y="620" font-family="Arial" font-size="18" fill="#1f2937">Generate traceable reports</text>
<rect x="1190" y="495" width="390" height="185" rx="12" fill="#bfdbfe"/><text x="1215" y="535" font-family="Arial" font-size="18" fill="#1f2937">Automatic calculation</text><text x="1215" y="575" font-family="Arial" font-size="18" fill="#1f2937">Dashboard + history</text><text x="1215" y="615" font-family="Arial" font-size="18" fill="#1f2937">Report generation</text>
<rect x="1640" y="515" width="185" height="145" rx="12" fill="#bbf7d0"/><text x="1665" y="555" font-family="Arial" font-size="17" fill="#1f2937">Average minutes</text><text x="1665" y="595" font-family="Arial" font-size="17" fill="#1f2937">vs. baseline</text>
<rect x="45" y="740" width="1810" height="250" rx="18" fill="#f0fdf4"/>
<rect x="65" y="770" width="315" height="185" rx="14" fill="#15803d"/><text x="90" y="810" font-family="Arial" font-size="21" font-weight="700" fill="white">Goal 3 - Reduction</text><text x="90" y="850" font-family="Arial" font-size="17" fill="white">70% create a measurable goal</text><text x="90" y="880" font-family="Arial" font-size="17" fill="white">and review it monthly for</text><text x="90" y="910" font-family="Arial" font-size="17" fill="white">3 months by 30/06/2027.</text>
<rect x="430" y="790" width="270" height="145" rx="12" fill="#fde68a"/><text x="455" y="830" font-family="Arial" font-size="18" fill="#1f2937">Operations manager</text><text x="455" y="870" font-family="Arial" font-size="18" fill="#1f2937">Sustainability lead</text><text x="455" y="910" font-family="Arial" font-size="18" fill="#1f2937">Facility leader</text>
<rect x="760" y="775" width="365" height="175" rx="12" fill="#ddd6fe"/><text x="785" y="815" font-family="Arial" font-size="18" fill="#1f2937">Set measurable targets</text><text x="785" y="855" font-family="Arial" font-size="18" fill="#1f2937">Assign reduction actions</text><text x="785" y="895" font-family="Arial" font-size="18" fill="#1f2937">Review progress monthly</text>
<rect x="1190" y="770" width="390" height="185" rx="12" fill="#bfdbfe"/><text x="1215" y="810" font-family="Arial" font-size="18" fill="#1f2937">Goals and plans</text><text x="1215" y="850" font-family="Arial" font-size="18" fill="#1f2937">Initiatives + progress</text><text x="1215" y="890" font-family="Arial" font-size="18" fill="#1f2937">Period comparison</text>
<rect x="1640" y="790" width="185" height="145" rx="12" fill="#bbf7d0"/><text x="1665" y="830" font-family="Arial" font-size="17" fill="#1f2937">Active orgs with</text><text x="1665" y="870" font-family="Arial" font-size="17" fill="#1f2937">3 monthly reviews</text>
<path d="M380 315 H425 M700 315 H755 M1125 315 H1185 M1580 315 H1635 M380 590 H425 M700 590 H755 M1125 590 H1185 M1580 590 H1635 M380 865 H425 M700 865 H755 M1125 865 H1185 M1580 865 H1635" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="60" y="1050" font-family="Arial" font-size="18" fill="#475569">The goals form a sequence: centralize reliable data - reduce reporting effort - manage reduction actions.</text>
</svg>